name: Portfolio CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, tests and metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducible development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build, test and audit
        run: npm run verify
      - name: Validate production bundle
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/site.js
          test -s dist/portfolio.css
          test -s dist/workbench-logic.js
          test -s dist/content.js
          test -s dist/video/mulyankan-system-walkthrough-presenter.mp4
          test -s dist/resumes/Himanshu_Shukla_fullstack_Public.pdf
          test -s dist/resumes/Himanshu_Shukla_software_Public.pdf
          test -s dist/resumes/Himanshu_Shukla_ml_Public.pdf

  browser:
    name: Chromium interaction smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducible development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build static site
        run: npm run build
      - name: Install headless Chromium and OS requirements
        run: npx playwright install --with-deps chromium
      - name: Run desktop, mobile, navigation and media smoke checks
        run: npm run smoke:browser
